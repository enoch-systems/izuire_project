<!-- The signing animation. First in the tree so the sheet is painted before the
     page it is covering, and last is the toast. -->
<app-signature-loader />
<!-- Everything below is storefront chrome. The admin console is its own
     application, so all of it stands down there and /admin renders bare —
     no header, no rate ticker, no shopper overlays, no footer. The signature
     loader stays outside the test because it is the app's own paint, and the
     overlays are cheap to hide but expensive to get wrong. -->
@if (!isAdmin()) {
  <app-site-header />
  <!-- The rate strip rides directly under the header on every page, so the day's
       rates are the first thing beneath the nav. It sits in normal flow rather
       than sticky: it goes with the page as the reader scrolls, leaving the header
       pinned exactly as it was. -->
  <app-rate-ticker />
  <app-search-overlay />
  <!-- The legal modal is a sibling of the search overlay for the same reason: it is
       opened from the footer, which lives below the routed page, and reads shared
       state rather than a reference to whoever opened it. -->
  <app-legal-modal />
  <!-- The auth modal sits with the other overlays and is driven by AuthService
       state, so the header, mobile sidebar and hero can all open it. -->
  <app-auth-modal />
  <!-- The working overlay for sign-in / sign-out, and the "are you sure?" step
       that precedes a sign-out. Both read AuthService, so any trigger anywhere on
       the site gets the same two surfaces. -->
  <app-auth-loader />
  <app-logout-confirm />
}
<router-outlet />
@if (offline()) {
     <div class="network-status network-status--offline" role="alert">
          <span class="network-status-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0120 0M5 12a10 10 0 0114 0m-11 3.2a5 5 0 018 0M12 19h.01M3 3l18 18" /></svg></span>
          <span><strong>You’re offline</strong><small>Changes can’t reach Izuire right now. Your page is still here; reconnect to continue.</small></span>
     </div>
} @else if (connectionRestored()) {
     <div class="network-status network-status--restored" role="status" aria-live="polite">
          <span class="network-status-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></svg></span>
          <span><strong>Connection restored</strong><small>You’re back online.</small></span>
     </div>
}
<app-action-feedback />
@if (!isAdmin()) {
  <app-site-footer />
  <!-- The add confirmation lives at the root so it reads the same from every page,
       not just the one the shopper happened to add from. -->
  <app-cart-toast />
}
