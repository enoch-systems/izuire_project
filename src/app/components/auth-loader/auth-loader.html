<!-- The working overlay. It sits above every other surface (z-index in the
     stylesheet) and carries no controls: there is nothing to press until the
     mock call lands. `role="status"` reads the changing copy out, so a screen
     reader hears the same progress a sighted reader sees. -->
@if (face(); as face) {
  <div
    class="authload"
    [class]="'authload--' + face.tone"
    role="status"
    aria-live="polite"
    [attr.aria-label]="face.label"
  >
    <div class="authload__sheet">
      <img class="authload__logo" [src]="logo" alt="IZUIRE">

      <p class="authload__label">
        {{ face.label }}<span class="authload__dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </p>
      <p class="authload__copy">{{ auth.loaderCopy() }}</p>

      <div class="authload__bar" aria-hidden="true">
        <span [style.width.%]="progress()"></span>
      </div>

      <p class="authload__secure">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
        Mock session, nothing leaves this device
      </p>
    </div>
  </div>
}
