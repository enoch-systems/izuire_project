<!-- Keyed on runId so a replay re-inserts the overlay and the CSS animations
     run again from the top. Decoration only, so it is hidden from assistive
     technology and takes no clicks: the real header logo behind it stays the
     thing anyone can actually reach. -->
@if (playing()) {
  <div class="sig" [class.sig--settled]="signed()" aria-hidden="true" [attr.data-run]="runId()">
    <div class="sig__sheet">
      <!-- The Z, drawn as a stroke so there is a path to follow. This is the
           wordmark's own geometry redrawn in the brand orange, which is what
           gives the animation a nib and an ink line rather than a fade.

           The path is square 120x120 and the viewBox matches, so the box is
           given an aspect-ratio rather than `height:auto` — an SVG with only a
           width has no intrinsic height and collapses to nothing. -->
      <svg class="sig__mark" viewBox="0 0 120 120" fill="none" aria-hidden="true">
        <path class="sig__z" d="M14 12 H106 L14 108 H106" stroke="currentColor" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter"/>
        <!-- The nib. Its dash offset is locked to the Z's so it rides the end of
             the stroke exactly, the way a pen tip sits on the line it is making. -->
        <path class="sig__nib" d="M14 12 H106 L14 108 H106" stroke="currentColor" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter"/>
      </svg>

      <div class="sig__word">
        <span class="sig__letters">
          <span style="--i:0">I</span><span style="--i:1">Z</span><span style="--i:2">U</span><span style="--i:3">I</span><span style="--i:4">R</span><span style="--i:5">E</span>
        </span>
        <span class="sig__rule"></span>
      </div>
    </div>
  </div>
}
