<main class="admin-login">
  <div class="card">
    <p class="mark">Izuire · Console</p>
    <h1>Admin sign in</h1>
    <p class="lede">Welcome back. Sign in to manage the Izuire catalogue.</p>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <form (submit)="submit($event)">
      <div class="field">
        <label for="admin-email">Email</label>
        <input
          id="admin-email"
          type="email"
          name="email"
          autocomplete="username"
          inputmode="email"
          placeholder="you@yourcompany.com"
          [(ngModel)]="email"
          [disabled]="busy()"
          required
        />
      </div>

      <div class="field">
        <label for="admin-password">Password</label>
        <div class="password-control">
          <input
            id="admin-password"
            [type]="passwordVisible() ? 'text' : 'password'"
            name="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            [(ngModel)]="password"
            [disabled]="busy()"
            required
          />
          <button type="button" class="password-toggle" [disabled]="busy()" (click)="togglePassword()" [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'" [attr.aria-pressed]="passwordVisible()">
            @if (passwordVisible()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 002.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0112 5c5.2 0 8.5 4.4 9.5 6-.4.7-1.3 2-2.8 3.3M6.2 6.2C3.9 7.7 2.8 9.5 2.5 11c.6 1.1 3.8 7 9.5 7 1 0 1.9-.2 2.7-.5"/></svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12s3.3-7 9.5-7 9.5 7 9.5 7-3.3 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="2.5"/></svg>
            }
          </button>
        </div>
      </div>

      <button type="submit" class="admin-login-submit" [disabled]="busy()" [attr.aria-busy]="busy()">
        @if (busy()) { <span class="admin-spinner" aria-hidden="true"></span> }
        {{ busy() ? 'Verifying access…' : 'Sign in to console' }}
      </button>
      @if (busy()) { <p class="auth-progress" role="status">Securely checking administrator access</p> }
    </form>

    <div class="foot">
      <a routerLink="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg> Back to the storefront</a>
      <span>Protected administrator access</span>
    </div>
  </div>
</main>
